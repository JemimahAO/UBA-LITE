services:
  # Backend API Service for JIREH UBA-LITE
  - type: web
    name: uba-lite-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: CORS_ORIGINS
        value: "https://uba-lite-frontend.onrender.com,http://localhost:3000"
      - key: DATABASE_URL
        value: sqlite:///./uba_lite.db
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Static Site for JIREH UBA-LITE
  - type: web
    name: uba-lite-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://uba-lite-api.onrender.com"
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
